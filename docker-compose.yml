services:
  homepage:
    build: .
    image: personal-homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # fixed inside the container – PORT in .env only changes the host port
      DATA_DIR: /data
      PORT: 3000
    volumes:
      - homepage-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  homepage-data:
